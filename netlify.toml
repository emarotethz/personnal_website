
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/.env"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/.env.*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/"
  status = 404
  force = true
